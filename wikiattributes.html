<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WikiAttributes – Entity Metadata Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Linux+Libertine:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--wb:#3366cc;--wb-bg:#eaf3ff;--wg:#14866d;--wg-bg:#d5fdf4;--wr:#d73333;--wr-bg:#fee7e6;--wy:#ac6600;--wy-bg:#fef6e7;--wp:#6b4ba1;--wp-bg:#f0e6ff;--wt:#0d7377;--wt-bg:#e0f5f5;--wo:#b35900;--wo-bg:#fff0e0;--bg:#f8f9fa;--sf:#fff;--bd:#a2a9b1;--bl:#c8ccd1;--tx:#202122;--tl:#54595d;--tlr:#72777d;--rm:4px;--sm:0 1px 2px rgba(0,0,0,.08);--md:0 2px 6px rgba(0,0,0,.1);--lg:0 4px 16px rgba(0,0,0,.12);--tr:200ms ease}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}
.header{background:var(--sf);border-bottom:1px solid var(--bl);position:sticky;top:0;z-index:100;box-shadow:var(--sm)}
.header-inner{max-width:1200px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--tx);flex-shrink:0}
.logo-icon{width:36px;height:36px;background:var(--tx);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Linux Libertine','Georgia',serif;font-size:22px;font-weight:700;line-height:1}
.logo-text{font-family:'Linux Libertine','Georgia',serif;font-size:22px;font-weight:700;letter-spacing:-.3px}
.logo-sub{font-size:11px;color:var(--tlr);text-transform:uppercase;letter-spacing:1px;margin-left:4px}
.header-badge{margin-left:auto;font-size:11px;font-weight:600;background:var(--wy-bg);color:var(--wy);padding:3px 10px;border-radius:12px;white-space:nowrap}
.main{max-width:1200px;margin:0 auto;padding:24px}
.entity-tabs{display:flex;gap:2px;background:var(--sf);border:1px solid var(--bl);border-radius:var(--rm);overflow:hidden;margin-bottom:20px}
.entity-tab{flex:1;padding:12px 16px;border:none;background:0 0;cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;color:var(--tl);transition:all var(--tr);display:flex;align-items:center;justify-content:center;gap:6px}
.entity-tab:hover{background:var(--bg);color:var(--tx)}.entity-tab.active{background:var(--wb);color:#fff}
.selector-row{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.selector-label{font-size:13px;font-weight:600;color:var(--tl);white-space:nowrap}
.entity-select{font-family:inherit;font-size:14px;padding:8px 12px;border:1px solid var(--bl);border-radius:var(--rm);background:var(--sf);color:var(--tx);min-width:220px;max-width:400px;cursor:pointer}
.entity-select:focus{outline:none;border-color:var(--wb);box-shadow:0 0 0 2px var(--wb-bg)}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:20px;padding:10px 14px;background:var(--sf);border:1px solid var(--bl);border-radius:var(--rm)}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tl)}
.source-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.source-dot.extracted{background:var(--wb)}.source-dot.wmf-model{background:var(--wg)}.source-dot.claude{background:var(--wp)}.source-dot.user-page{background:var(--wt)}.source-dot.sample{background:var(--wo)}
.entity-header{margin-bottom:20px}
.entity-title{font-family:'Linux Libertine','Georgia',serif;font-size:28px;font-weight:700;line-height:1.2;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.entity-type-badge{font-family:'Source Sans 3',sans-serif;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;padding:3px 10px;border-radius:12px;background:var(--wb-bg);color:var(--wb)}
.entity-subtitle{font-size:14px;color:var(--tl);margin-top:4px}
.attributes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.attr-card{background:var(--sf);border:1px solid var(--bl);border-radius:var(--rm);padding:16px;position:relative;animation:fadeIn 300ms ease both;transition:box-shadow var(--tr)}
.attr-card:hover{box-shadow:var(--md)}.attr-card.full-width{grid-column:1/-1}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.attr-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:8px}
.attr-label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;color:var(--tlr)}
.attr-source-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:2px 8px;border-radius:10px;cursor:pointer;transition:all var(--tr);white-space:nowrap;flex-shrink:0;position:relative;z-index:2}
.attr-source-tag.extracted{background:var(--wb-bg);color:var(--wb)}.attr-source-tag.wmf-model{background:var(--wg-bg);color:var(--wg)}.attr-source-tag.claude{background:var(--wp-bg);color:var(--wp)}.attr-source-tag.user-page{background:var(--wt-bg);color:var(--wt)}.attr-source-tag.sample{background:var(--wo-bg);color:var(--wo)}
.attr-source-tag:hover{filter:brightness(.95);transform:scale(1.02)}
.attr-value{font-size:22px;font-weight:700;color:var(--tx);line-height:1.2;margin-bottom:2px}.attr-value.small{font-size:16px}
.attr-detail{font-size:12.5px;color:var(--tl);margin-top:2px}
.score-bar-track{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin-top:8px}
.score-bar-fill{height:100%;border-radius:3px;transition:width 600ms cubic-bezier(.34,1.56,.64,1);width:0}
.score-bar-fill.blue{background:var(--wb)}.score-bar-fill.green{background:var(--wg)}.score-bar-fill.red{background:var(--wr)}.score-bar-fill.yellow{background:var(--wy)}.score-bar-fill.purple{background:var(--wp)}
.score-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--tlr);margin-top:3px}
.attr-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.attr-badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:12px;background:var(--bg);color:var(--tl);border:1px solid var(--bl)}
.attr-badge.primary{background:var(--wb-bg);color:var(--wb);border-color:transparent}.attr-badge.success{background:var(--wg-bg);color:var(--wg);border-color:transparent}.attr-badge.warning{background:var(--wy-bg);color:var(--wy);border-color:transparent}.attr-badge.danger{background:var(--wr-bg);color:var(--wr);border-color:transparent}
.tooltip-popup{display:none;position:fixed;z-index:10000;background:var(--sf);border:1px solid var(--bd);border-radius:var(--rm);box-shadow:var(--lg);padding:14px 16px;width:320px;max-width:90vw;font-size:13px;line-height:1.5;color:var(--tx)}.tooltip-popup.active{display:block}
.tooltip-popup .tooltip-title{font-weight:700;margin-bottom:6px}.tooltip-popup .tooltip-body{color:var(--tl);font-size:12.5px}
.tooltip-popup .tooltip-link{display:inline-block;margin-top:8px;font-size:12px;color:var(--wb);text-decoration:none;font-weight:600}.tooltip-popup .tooltip-link:hover{text-decoration:underline}
.tooltip-popup .tooltip-close{position:absolute;top:8px;right:10px;background:none;border:none;font-size:18px;cursor:pointer;color:var(--tlr);line-height:1}.tooltip-popup .tooltip-close:hover{color:var(--tx)}
.tooltip-overlay{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.08)}.tooltip-overlay.active{display:block}
.section-label{font-size:13px;font-weight:700;color:var(--tl);text-transform:uppercase;letter-spacing:.5px;margin:20px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--bl);grid-column:1/-1}.section-label:first-child{margin-top:0}
.status-indicator{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600}
.status-dot{width:8px;height:8px;border-radius:50%}.status-dot.high{background:var(--wg)}.status-dot.medium{background:var(--wy)}.status-dot.low{background:var(--wr)}
.quality-stars{display:inline-flex;gap:2px;font-size:18px}.quality-star{color:#ddd}.quality-star.filled{color:#f5c518}
.sparkline-wrap{margin-top:10px}.sparkline-canvas{width:100%;height:60px;display:block}
.sparkline-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--tlr);margin-top:2px}
.section-text-toggle{background:var(--sf);border:1px solid var(--bl);border-radius:var(--rm);margin-bottom:16px;overflow:hidden}
.section-text-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;font-size:13px;font-weight:600;color:var(--tl);user-select:none;transition:background var(--tr)}
.section-text-header:hover{background:var(--bg)}
.section-text-header .chevron{transition:transform var(--tr);font-size:16px}
.section-text-header.open .chevron{transform:rotate(180deg)}
.section-text-body{display:none;padding:0 14px 14px;font-size:13.5px;line-height:1.7;color:var(--tx);border-top:1px solid var(--bl)}
.section-text-body.open{display:block;padding-top:12px}
.fun-fact-box{background:var(--wy-bg);border-left:3px solid var(--wy);padding:8px 12px;margin-top:8px;font-size:12.5px;border-radius:0 var(--rm) var(--rm) 0;color:var(--tx)}
.fun-fact-box strong{color:var(--wy)}
.footer{max-width:1200px;margin:40px auto 20px;padding:20px 24px;text-align:center;font-size:12px;color:var(--tlr);border-top:1px solid var(--bl)}
.footer a{color:var(--wb);text-decoration:none}.footer a:hover{text-decoration:underline}
@media(max-width:768px){.header-inner{padding:10px 16px}.logo-sub{display:none}.main{padding:16px}.attributes-grid{grid-template-columns:1fr}.entity-tabs{flex-wrap:wrap}.entity-tab{flex:1 1 45%}.selector-row{flex-direction:column;align-items:stretch}.entity-select{max-width:100%}}
</style>

  {id:'s1',name:'Coco Gauff \u2013 Early life',subtitle:'en.wikipedia.org \u00b7 Section',
   sectionText:'Cori Dionne "Coco" Gauff was born on March 13, 2004, in Delray Beach, Florida. Her father, Corey Gauff, played basketball at Georgia State University, while her mother, Candi Odom Gauff, was a track and field athlete at Florida State University. Both parents gave up their careers to support their daughter\u2019s tennis training. Gauff began playing tennis at the age of six and, by seven, was training with a pro two hours a day. She won the Little Mo 8-under Nationals in 2012. At the age of 10, she began training at the Mouratoglou Tennis Academy in France, run by Patrick Mouratoglou, longtime coach of Serena Williams. Mouratoglou commented: "She was only 10 years old, but you could feel she was already extremely ambitious." Gauff has said that Serena and Venus Williams are her tennis idols and the reason she picked up a racquet. She has two younger brothers, Codey and Cameron. Her family relocated from Georgia to Delray Beach, Florida, to be closer to top-tier tennis training facilities.',

  {id:'s2',name:'Atmosphere of Jupiter \u2013 Chemical composition',subtitle:'en.wikipedia.org \u00b7 Section',
   sectionText:'The composition of Jupiter\u2019s atmosphere is similar to that of the planet as a whole. The two main constituents are molecular hydrogen (H\u2082) and helium. The helium abundance is 0.157 \u00b1 0.0036 relative to molecular hydrogen by number of molecules, and its mass fraction is 0.234 \u00b1 0.005, which is slightly lower than the primordial solar value. The atmosphere contains various simple compounds such as water, methane (CH\u2084), hydrogen sulfide (H\u2082S), ammonia (NH\u2083) and phosphine (PH\u2083). Their abundances in the deep troposphere imply that Jupiter is enriched in carbon, nitrogen, sulfur and possibly oxygen by a factor of 2\u20134 relative to the Sun. The noble gases argon, krypton and xenon appear enriched relative to solar abundances as well, while neon is scarcer. The upper atmosphere contains small amounts of simple hydrocarbons such as ethane, acetylene, and diacetylene, which form from methane under the influence of solar ultraviolet radiation and charged particles from Jupiter\u2019s magnetosphere. Carbon dioxide, carbon monoxide and water present in the upper atmosphere are thought to originate from impacting comets, such as Shoemaker-Levy 9.',

  {id:'s3',name:'Giant panda \u2013 Behavior',subtitle:'en.wikipedia.org \u00b7 Section',
   sectionText:'The giant panda is a solitary animal which gathers only during mating season. It spends 10\u201316 hours a day feeding, mainly on bamboo. Despite being classified as a carnivore, its diet is over 99% bamboo. It can consume 12 to 38 kilograms of bamboo per day to compensate for the low energy content of its food. Giant pandas are good swimmers and surprisingly agile tree climbers. Cubs begin climbing at around five months old, sometimes practicing by climbing on their mother. The panda relies heavily on olfactory communication, using scent marks deposited on trees, rocks, and the ground as chemical cues. Both males and females mark their territory with urine and glandular secretions. During breeding season, females secrete chemical cues including civetone and decanoic acid, which are considered pheromones and promote behavioral responses in males. Giant pandas do not hibernate, as their low-calorie bamboo diet prevents them from building sufficient fat reserves. Pandas have been observed rolling in fresh horse manure, which scientists believe may help numb them to cold temperatures due to sesquiterpenes found in the dung.',

let currentType='user',currentEntityIndex=0,activeTooltip=null,tipN=0;
function init(){
  document.querySelectorAll('.entity-tab').forEach(t=>t.addEventListener('click',()=>{currentType=t.dataset.type;currentEntityIndex=0;updateTabs();populateSelect();renderEntity()}));
  document.getElementById('entitySelect').addEventListener('change',e=>{currentEntityIndex=parseInt(e.target.value);renderEntity()});
  document.getElementById('tooltipOverlay').addEventListener('click',closeTooltips);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeTooltips()});
  populateSelect();renderEntity();
}
function updateTabs(){document.querySelectorAll('.entity-tab').forEach(t=>{const a=t.dataset.type===currentType;t.classList.toggle('active',a);t.setAttribute('aria-selected',a)})}
function updateLegend(){
  const e=DATA[currentType][currentEntityIndex];if(!e)return;
  const s=new Set();Object.entries(e.attrs).forEach(([k,v])=>{if(k!=='_sections'&&v.source)s.add(v.source)});
  document.getElementById('legendBar').innerHTML=[...s].map(x=>`<div class="legend-item"><span class="source-dot ${x}"></span> ${SL[x]||x}</div>`).join('');
}
function populateSelect(){
  const sel=document.getElementById('entitySelect'),ents=DATA[currentType];
  sel.innerHTML=ents.map((e,i)=>`<option value="${i}">${e.name}</option>`).join('');sel.value=currentEntityIndex;
}
function renderEntity(){
  closeTooltips();
  const entity=DATA[currentType][currentEntityIndex];if(!entity)return;updateLegend();
  const tl={user:'User',article:'Article',section:'Section'};
  document.getElementById('entityHeader').innerHTML=`<div class="entity-header"><div class="entity-title">${entity.name}<span class="entity-type-badge">${tl[currentType]}</span></div>${entity.subtitle?`<div class="entity-subtitle">${entity.subtitle}</div>`:''}</div>`;
  // Section text toggle
  const sta=document.getElementById('sectionTextArea');
  if(currentType==='section'&&entity.sectionText){
    sta.innerHTML=`<div class="section-text-toggle"><div class="section-text-header" id="sectionToggleBtn"><span>\ud83d\udcc4 View section text</span><span class="chevron">\u25bc</span></div><div class="section-text-body" id="sectionToggleBody">${entity.sectionText}</div></div>`;
    document.getElementById('sectionToggleBtn').addEventListener('click',function(){this.classList.toggle('open');document.getElementById('sectionToggleBody').classList.toggle('open')});
  }else{sta.innerHTML=''}
  const grid=document.getElementById('attributesGrid'),attrs=entity.attrs,sections=attrs._sections;
  let html='',ci=0;
  if(sections){Object.entries(sections).forEach(([sn,keys])=>{html+=`<div class="section-label">${sn}</div>`;keys.forEach(k=>{if(attrs[k])html+=renderCard(k,attrs[k],ci++)})})}
  else{Object.entries(attrs).forEach(([k,a])=>{if(k==='_sections')return;html+=renderCard(k,a,ci++)})}
  grid.innerHTML=html;
  requestAnimationFrame(()=>setTimeout(()=>{document.querySelectorAll('.score-bar-fill').forEach(b=>{b.style.width=b.dataset.width})},50));
  document.querySelectorAll('.sparkline-canvas').forEach(c=>drawSparkline(c));
  document.querySelectorAll('.attr-source-tag').forEach(t=>t.addEventListener('click',function(e){e.stopPropagation();showTooltipPopup(this,TIPS[this.dataset.tooltip])}));
}
function renderCard(key,attr,idx){
  const delay=Math.min(idx*30,300),tid=`t${++tipN}`,fw=((key==='Edit Risk'&&attr.sparkline)||(key==='Editing Activity'&&attr.sparkline))?' full-width':'';
  TIPS[tid]={method:attr.method||'',link:attr.link||''};
  let vh='';
  if(attr.type==='score'){
    const c=attr.color||'blue';
    vh=`<div class="attr-value">${attr.value}<span style="font-size:14px;font-weight:400;color:var(--tlr)"> / 100</span></div>${attr.detail?`<div class="attr-detail">${attr.detail}</div>`:''}<div class="score-bar-track"><div class="score-bar-fill ${c}" data-width="${attr.value}%"></div></div><div class="score-labels"><span>0</span><span>100</span></div>`;
    if(attr.sparkline)vh+=`<div class="sparkline-wrap"><div class="attr-detail" style="margin-bottom:4px;font-weight:600">Risk trend over time</div><canvas class="sparkline-canvas" data-points="${attr.sparkline.join(',')}" data-color="${c}" width="500" height="60"></canvas><div class="sparkline-labels">${attr.sparkLabels.map(l=>`<span>${l}</span>`).join('')}</div></div>`;
    if(attr.funFacts&&attr.funFacts.length>0)vh+=`<div class="fun-fact-box"><strong>\u2728 Fun facts from this section:</strong><ul style="margin:6px 0 0 16px;padding:0">${attr.funFacts.map(f=>`<li style="margin-bottom:4px">${f}</li>`).join('')}</ul></div>`;
  }else if(attr.type==='sparkline-only'){
    const c=attr.color||'blue';
    vh=`${attr.detail?`<div class="attr-detail">${attr.detail}</div>`:''}<div class="sparkline-wrap"><canvas class="sparkline-canvas" data-points="${attr.sparkline.join(',')}" data-color="${c}" width="500" height="60"></canvas><div class="sparkline-labels">${attr.sparkLabels.map(l=>`<span>${l}</span>`).join('')}</div></div>`;
  }else if(attr.type==='badges'){
    vh=`<div class="attr-badges">${attr.value.map(v=>`<span class="attr-badge ${attr.badgeClass||''}">${v}</span>`).join('')}</div>`;
  }else if(attr.type==='badge-single'){
    vh=`<span class="attr-badge ${attr.badgeClass||''}" style="font-size:14px;padding:4px 14px">${attr.value}</span>${attr.detail?`<div class="attr-detail" style="margin-top:6px">${attr.detail}</div>`:''}`;
  }else if(attr.type==='quality'){
    const s=attr.stars||0;
    vh=`<div style="display:flex;align-items:center;gap:10px"><span class="attr-value" style="margin-bottom:0">${attr.value}</span><span class="quality-stars">${Array.from({length:5},(_,i)=>`<span class="quality-star ${i<s?'filled':''}">★</span>`).join('')}</span></div>${attr.detail?`<div class="attr-detail">${attr.detail}</div>`:''}`;
  }else if(attr.type==='status'){
    vh=`<div class="status-indicator"><span class="status-dot ${attr.status}"></span><span class="attr-value small" style="margin-bottom:0">${attr.value}</span></div>${attr.detail?`<div class="attr-detail">${attr.detail}</div>`:''}`;
  }else{
    vh=`<div class="attr-value small">${attr.value}</div>${attr.detail?`<div class="attr-detail">${attr.detail}</div>`:''}`;
  }
  return `<div class="attr-card${fw}" style="animation-delay:${delay}ms"><div class="attr-card-top"><span class="attr-label">${key}</span><span class="attr-source-tag ${attr.source}" data-tooltip="${tid}" title="Click for details">${SLS[attr.source]||attr.source}</span></div>${vh}</div>`;
}
function showTooltipPopup(el,data){
  if(!data)return;closeTooltips();
  const popup=document.getElementById('tooltipPopup'),overlay=document.getElementById('tooltipOverlay');
  let h=`<button class="tooltip-close" aria-label="Close">&times;</button><div class="tooltip-title">How this is determined</div><div class="tooltip-body">${data.method}</div>`;
  if(data.link)h+=`<a class="tooltip-link" href="${data.link}" target="_blank" rel="noopener">View model card \u2197</a>`;
  popup.innerHTML=h;
  const r=el.getBoundingClientRect(),pw=320;
  let top=r.bottom+8,left=r.right-pw;
  if(left<8)left=8;if(left+pw>window.innerWidth-8)left=window.innerWidth-pw-8;
  popup.style.top=top+'px';popup.style.left=left+'px';
  popup.classList.add('active');overlay.classList.add('active');
  const pr=popup.getBoundingClientRect();
  if(pr.bottom>window.innerHeight-8){top=r.top-pr.height-8;if(top<8)top=8;popup.style.top=top+'px'}
  activeTooltip=true;
  popup.querySelector('.tooltip-close').addEventListener('click',closeTooltips);
  popup.addEventListener('click',e=>e.stopPropagation());
}
function closeTooltips(){document.getElementById('tooltipPopup').classList.remove('active');document.getElementById('tooltipOverlay').classList.remove('active');activeTooltip=null}
function drawSparkline(canvas){
  const pts=canvas.dataset.points.split(',').map(Number),cn=canvas.dataset.color||'green';
  const colors={green:'#14866d',blue:'#3366cc',red:'#d73333',yellow:'#ac6600',purple:'#6b4ba1'};
  const color=colors[cn]||colors.green,ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height,p=4;
  const mx=Math.max(...pts,1),mn=Math.min(...pts,0),r=mx-mn||1;
  ctx.clearRect(0,0,w,h);
  ctx.beginPath();pts.forEach((v,i)=>{const x=p+(i/(pts.length-1))*(w-2*p),y=h-p-((v-mn)/r)*(h-2*p);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});
  ctx.lineTo(p+(w-2*p),h-p);ctx.lineTo(p,h-p);ctx.closePath();ctx.fillStyle=color+'18';ctx.fill();
  ctx.beginPath();pts.forEach((v,i)=>{const x=p+(i/(pts.length-1))*(w-2*p),y=h-p-((v-mn)/r)*(h-2*p);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});
  ctx.strokeStyle=color;ctx.lineWidth=2;ctx.lineJoin='round';ctx.stroke();
  pts.forEach((v,i)=>{const x=p+(i/(pts.length-1))*(w-2*p),y=h-p-((v-mn)/r)*(h-2*p);ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke()});
}
document.addEventListener('DOMContentLoaded',init);
</script></body></html>
