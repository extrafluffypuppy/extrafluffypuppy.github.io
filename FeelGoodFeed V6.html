body{font-family:'Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}

.logo-icon{width:36px;height:36px;background:var(--tx);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Linux Libertine',Georgia,serif;font-size:22px;font-weight:700;line-height:1}
.logo-text{font-family:'Linux Libertine',Georgia,serif;font-size:21px;font-weight:700;letter-spacing:-.3px}
.logo-sub{font-size:11px;color:var(--tlr);text-transform:uppercase;letter-spacing:1px;margin-left:4px}
.header-badge{margin-left:auto;font-size:11px;font-weight:600;background:var(--wy-bg);color:var(--wy);padding:3px 10px;border-radius:12px;white-space:nowrap}
.filter-bar{max-width:780px;margin:0 auto;padding:16px 24px 12px;position:sticky;top:61px;z-index:90;background:var(--bg)}
.filter-group{background:var(--sf);border:1px solid var(--bl);border-radius:var(--rm);padding:14px 16px 10px;margin-bottom:10px}
.filter-group-header{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.filter-group-title{font-family:'Linux Libertine',Georgia,serif;font-size:15px;font-weight:700;color:var(--tx);letter-spacing:-.2px}
.filter-group-hint{font-size:11px;color:var(--tlr);font-style:italic}
.filter-group-divider{height:0;margin:0}
.filter-section{margin-bottom:6px;display:flex;align-items:center;gap:8px}
.filter-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--tlr);white-space:nowrap;min-width:80px}
.filter-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;padding:2px 0}
.filter-chips::-webkit-scrollbar{display:none}
.fc{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:20px;border:1.5px solid var(--bl);background:var(--sf);cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:var(--tl);white-space:nowrap;transition:all var(--tr);flex-shrink:0;user-select:none}
.fc:hover{border-color:var(--bd);color:var(--tx);box-shadow:var(--sm)}
.fc.active{background:var(--tx);color:#fff;border-color:var(--tx)}
.fc .ce{font-size:14px;line-height:1}
.feed-wrap{max-width:780px;margin:0 auto;padding:8px 24px 80px}
.feed-count{font-size:12px;color:var(--tlr);margin-bottom:16px;text-align:center}
.card{margin-bottom:24px;border-radius:var(--rm);overflow:hidden;position:relative;background:var(--sf);border:1px solid var(--bl);opacity:0;transform:translateY(20px);transition:opacity .45s ease,transform .45s ease,box-shadow var(--tr)}
.card.visible{opacity:1;transform:translateY(0)}
.card:hover{box-shadow:var(--md)}
.card[data-color="blue"]{border-top:4px solid var(--wb)}
.card[data-color="green"]{border-top:4px solid var(--wg)}
.card[data-color="purple"]{border-top:4px solid var(--wp)}
.card[data-color="teal"]{border-top:4px solid var(--wt)}
.card[data-color="orange"]{border-top:4px solid var(--wo)}
.card[data-color="gold"]{border-top:4px solid #c5960c}
.card[data-color="rose"]{border-top:4px solid #b85570}
.card[data-color="slate"]{border-top:4px solid #5a6978}
.card-body{padding:24px 28px 22px}
.card-img{width:100%;max-height:240px;overflow:hidden;position:relative;background:linear-gradient(135deg,var(--wb-bg),var(--wg-bg))}
.card-img img{width:100%;height:240px;object-fit:cover;display:block;transition:transform .4s ease}
.card:hover .card-img img{transform:scale(1.03)}
.card-img .img-fade{position:absolute;bottom:0;left:0;right:0;height:60px;background:linear-gradient(transparent,rgba(255,255,255,.9))}
.quote-layout{display:flex;gap:20px;align-items:flex-start}
.ql-text{flex:1;min-width:0}
.ql-source{flex-shrink:0;text-align:right;max-width:180px;padding-top:4px}

.article-title{font-family:'Linux Libertine',Georgia,serif;font-size:22px;font-weight:700;line-height:1.3;color:var(--wb);text-decoration:none;display:inline-block;transition:color var(--tr)}

.feed-end{text-align:center;padding:40px 20px;font-size:14px;color:var(--tlr)}
.feed-end a{color:var(--wb);text-decoration:none;font-weight:600}
.feed-end a:hover{text-decoration:underline}
.footer{max-width:780px;margin:20px auto;padding:20px 24px;text-align:center;font-size:12px;color:var(--tlr);border-top:1px solid var(--bl)}

// ====== WIKIPEDIA ACTION API FUNCTIONS ======
// Convert slug to proper title for API
function slugToTitle(slug) {
  try { return decodeURIComponent(slug).replace(/_/g, ' '); }
  catch(e) { return slug.replace(/_/g, ' '); }
}

// Build a slug-to-title map for matching API responses back
function buildTitleMap(slugs) {
  var map = {};
  slugs.forEach(function(s) {
    var t = slugToTitle(s).toLowerCase();
    map[t] = s;
  });
  return map;
}

// Fetch extracts using Action API with formatversion=2
// Uses prop=extracts with exintro, explaintext, and exlimit=20
async function fetchExtracts(slugs) {
  var results = {};
  var titleMap = buildTitleMap(slugs);

  // Batch into groups of 20 (API max for exlimit with exintro)
  for (var i = 0; i < slugs.length; i += 20) {
    var batch = slugs.slice(i, i + 20);
    var titles = batch.map(slugToTitle).join('|');
    var url = 'https://en.wikipedia.org/w/api.php?action=query'
      + '&prop=extracts'
      + '&exintro=1'
      + '&explaintext=1'
      + '&exlimit=' + batch.length
      + '&redirects=1'
      + '&formatversion=2'
      + '&format=json'
      + '&origin=*'
      + '&titles=' + encodeURIComponent(titles);
    try {
      var resp = await fetch(url);
      var data = await resp.json();
      // formatversion=2 returns pages as an array
      var pages = (data && data.query && data.query.pages) || [];
      pages.forEach(function(p) {
        if (p.extract && !p.missing) {
          var ext = p.extract;
          // Get first paragraph only
          var firstPara = ext.split('\n')[0].trim();
          // For quotes: limit to ~800 chars at a sentence boundary
          if (firstPara.length > 800) {
            var cut = firstPara.substring(0, 800);
            var lastDot = cut.lastIndexOf('. ');
            if (lastDot > 150) firstPara = cut.substring(0, lastDot + 1);
            else firstPara = cut + '\u2026';
          }
          // Match back to slug via title
          var key = (p.title || '').toLowerCase();
          var matchSlug = titleMap[key];
          if (matchSlug) {
            results[matchSlug] = firstPara;
          } else {
            // Fallback: try matching with underscores
            var keyU = key.replace(/ /g, '_');
            batch.forEach(function(s) {
              if (s.toLowerCase() === keyU || slugToTitle(s).toLowerCase() === key) {
                results[s] = firstPara;
              }
            });
          }
        }
      });
    } catch(e) { console.warn('Batch extract failed', i, e); }

    // Update progress
    var pct = Math.min(100, Math.round(((i + batch.length) / slugs.length) * 100));
    var bar = document.getElementById('progBar');
    if (bar) bar.style.width = pct + '%';
  }

  // Fallback: fetch individually any slugs that failed in batch mode
  var missing = slugs.filter(function(s) { return !results[s]; });
  for (var j = 0; j < missing.length; j++) {
    var s = missing[j];
    var title = slugToTitle(s);
    var url2 = 'https://en.wikipedia.org/w/api.php?action=query'
      + '&prop=extracts'
      + '&exintro=1'
      + '&explaintext=1'
      + '&redirects=1'
      + '&formatversion=2'
      + '&format=json'
      + '&origin=*'
      + '&titles=' + encodeURIComponent(title);
    try {
      var resp2 = await fetch(url2);
      var data2 = await resp2.json();
      var pages2 = (data2 && data2.query && data2.query.pages) || [];
      if (pages2[0] && pages2[0].extract && !pages2[0].missing) {
        var ext2 = pages2[0].extract.split('\n')[0].trim();
        if (ext2.length > 800) {
          var cut2 = ext2.substring(0, 800);
          var ld = cut2.lastIndexOf('. ');
          ext2 = ld > 150 ? cut2.substring(0, ld + 1) : cut2 + '\u2026';
        }
        results[s] = ext2;
      }
    } catch(e2) { console.warn('Individual fetch failed:', s, e2); }
  }

  return results;
}

// Fetch page images using Action API with formatversion=2
async function fetchImages(slugs) {
  var results = {};
  var titleMap = buildTitleMap(slugs);

  for (var i = 0; i < slugs.length; i += 50) {
    var batch = slugs.slice(i, i + 50);
    var titles = batch.map(slugToTitle).join('|');
    var url = 'https://en.wikipedia.org/w/api.php?action=query'
      + '&prop=pageimages'
      + '&pithumbsize=640'
      + '&pilimit=50'
      + '&redirects=1'
      + '&formatversion=2'
      + '&format=json'
      + '&origin=*'
      + '&titles=' + encodeURIComponent(titles);
    try {
      var resp = await fetch(url);
      var data = await resp.json();
      var pages = (data && data.query && data.query.pages) || [];
      pages.forEach(function(p) {
        if (p.thumbnail && p.thumbnail.source) {
          var key = (p.title || '').toLowerCase();
          var matchSlug = titleMap[key];
          if (matchSlug) {
            results[matchSlug] = p.thumbnail.source;
          } else {
            batch.forEach(function(s) {
              if (slugToTitle(s).toLowerCase() === key) results[s] = p.thumbnail.source;
            });
          }
        }
      });
    } catch(e) { console.warn('Image batch failed', e); }
  }
  return results;
}

// ====== APP LOGIC ======
function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function wordCount(s){return s?s.split(/\s+/).length:0;}
function readingMins(item){
  if(item.type==='a') return item.readMins||10;
  var t = item.exactText||item.fetchedText||'';
  return Math.max(1,Math.ceil(wordCount(t)/WPM));
}
function getFiltered(){
  // Only include quotes that have text loaded
  var list = ITEMS.filter(function(it){
    if(it.type==='a') return true;
    return !!(it.exactText || it.fetchedText);
  });

  // Filter by active mood and/or interest
  if(activeMood){
    list=list.filter(function(i){return i.moods&&i.moods.indexOf(activeMood)!==-1;});
  }
  if(activeInterest){
    list=list.filter(function(i){return i.interests&&i.interests.indexOf(activeInterest)!==-1;});
  }

  // Score and rank if a mood or interest is active
  if(activeMood || activeInterest){
    list.forEach(function(item){
      var score=0;
      if(activeMood && item.moods){
        var idx=item.moods.indexOf(activeMood);
        if(idx===0) score+=3;        // primary mood
        else if(idx===1) score+=2;   // secondary mood
        else if(idx>=2) score+=1;    // tertiary
      }
      if(activeInterest && item.interests){
        var idx2=item.interests.indexOf(activeInterest);
        if(idx2===0) score+=3;
        else if(idx2===1) score+=2;
        else if(idx2>=2) score+=1;
      }
      item._score=score;
    });
    // Sort by score descending, with randomization within same score
    list.sort(function(a,b){
      if(b._score!==a._score) return b._score-a._score;
      return Math.random()-0.5;
    });
    // Interleave: no more than 3 quotes or 3 articles in a row
    list = interleave(list);
  } else {
    list = shuffle(list);
    list = interleave(list);
  }

  if(activeTime){
    var budget=activeTime,result=[];
    for(var i=0;i<list.length&&budget>0;i++){var cost=readingMins(list[i]);if(cost<=budget){result.push(list[i]);budget-=cost;}}
    return result;
  }
  return list;
}

// Interleave so no more than 3 of the same type appear consecutively.
// Preserves relative order / ranking as much as possible.
function interleave(sorted){
  if(sorted.length<=3) return sorted;
  var result=[];
  var queue=sorted.slice(); // working copy
  var MAX_RUN=3;

  while(queue.length>0){
    // Count current run at end of result
    var runType=result.length>0?result[result.length-1].type:null;
    var runLen=0;
    for(var r=result.length-1;r>=0;r--){
      if(result[r].type===runType) runLen++;
      else break;
    }

    if(runLen>=MAX_RUN){
      // Need the opposite type next
      var needed=(runType==='q')?'a':'q';
      var idx=-1;
      for(var j=0;j<queue.length;j++){
        if(queue[j].type===needed){idx=j;break;}
      }
      if(idx===-1){
        // No more of the needed type, just push the rest
        result=result.concat(queue);
        break;
      }
      result.push(queue.splice(idx,1)[0]);
    } else {
      result.push(queue.shift());
    }
  }
  return result;
}
function buildFilters(){
  var mEl=document.getElementById('moodChips'),iEl=document.getElementById('interestChips'),tEl=document.getElementById('timeChips');
  mEl.innerHTML='<button class="fc'+(!activeMood?' active':'')+'" data-mood=""><span class="ce">\u2728</span>All</button>'+MOODS.map(function(m){return '<button class="fc'+(activeMood===m.id?' active':'')+'" data-mood="'+m.id+'"><span class="ce">'+m.emoji+'</span>'+m.label+'</button>';}).join('');
  iEl.innerHTML='<button class="fc'+(!activeInterest?' active':'')+'" data-interest=""><span class="ce">\uD83C\uDF0D</span>All</button>'+INTERESTS.map(function(m){return '<button class="fc'+(activeInterest===m.id?' active':'')+'" data-interest="'+m.id+'"><span class="ce">'+m.emoji+'</span>'+m.label+'</button>';}).join('');
  tEl.innerHTML=TIMES.map(function(t){return '<button class="fc'+(activeTime===t.id?' active':'')+'" data-time="'+t.id+'"><span class="ce">\u23F1\uFE0F</span>'+t.label+'</button>';}).join('');
  document.querySelectorAll('#moodChips .fc').forEach(function(c){c.addEventListener('click',function(){var v=this.dataset.mood;activeMood=v||null;if(v)activeInterest=null;resetFeed();});});
  document.querySelectorAll('#interestChips .fc').forEach(function(c){c.addEventListener('click',function(){var v=this.dataset.interest;activeInterest=v||null;if(v)activeMood=null;resetFeed();});});
  document.querySelectorAll('#timeChips .fc').forEach(function(c){c.addEventListener('click',function(){var tv=parseInt(this.dataset.time);activeTime=activeTime===tv?null:tv;resetFeed();});});
}
function resetFeed(){rendered=0;document.getElementById('feed').innerHTML='';document.getElementById('feedEnd').style.display='none';currentList=getFiltered();buildFilters();updateCount();loadMore();window.scrollTo({top:0,behavior:'smooth'});}
function updateCount(){
  var qs=currentList.filter(function(i){return i.type==='q';}).length;
  var as=currentList.filter(function(i){return i.type==='a';}).length;
  var totalMins=0;currentList.forEach(function(i){totalMins+=readingMins(i);});
  document.getElementById('feedCount').textContent=currentList.length+' items \u00b7 '+qs+' quotes, '+as+' articles \u00b7 ~'+totalMins+' min read';
}
var imgCache={};
function renderCard(item,idx){
  var color=COLORS[idx%COLORS.length];
  var url='https://en.wikipedia.org/wiki/'+item.slug;
  var imgSrc=imgCache[item.slug]||'';
  var html='<div class="card" data-color="'+color+'">';
  if(imgSrc){html+='<div class="card-img"><img src="'+imgSrc+'" alt="'+item.title+'" loading="lazy" onerror="this.parentElement.style.display=\'none\'"><div class="img-fade"></div></div>';}
  html+='<div class="card-body">';
  if(item.type==='q'){
    var text=item.exactText||item.fetchedText||'';
    html+='<div class="quote-layout"><div class="ql-text"><div class="qt">'+escHtml(text)+'</div></div>';
    html+='<div class="ql-source"><a class="al" href="'+url+'" target="_blank" rel="noopener">'+escHtml(item.title)+'</a>';
    html+='<div style="font-size:11px;color:var(--tlr);margin-top:4px">'+readingMins(item)+' min read</div></div></div>';
  } else {
    html+='<a class="article-title" href="'+url+'" target="_blank" rel="noopener">'+escHtml(item.title)+'</a>';
    if(item.fetchedText) html+='<div class="article-desc">'+escHtml(item.fetchedText)+'</div>';
    html+='<div class="article-reading">\u23F1\uFE0F ~'+item.readMins+' min read</div>';
  }
  html+='</div></div>';
  return html;
}
function escHtml(s){if(!s)return '';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function loadMore(){
  if(rendered>=currentList.length){document.getElementById('feedEnd').style.display='block';return;}
  var feed=document.getElementById('feed'),end=Math.min(rendered+batchSize,currentList.length),html='';
  for(var i=rendered;i<end;i++) html+=renderCard(currentList[i],i);
  feed.insertAdjacentHTML('beforeend',html);
  rendered=end;updateCount();
  if(rendered>=currentList.length) document.getElementById('feedEnd').style.display='block';
  requestAnimationFrame(observeCards);
}
var observer=new IntersectionObserver(function(entries){entries.forEach(function(e){if(e.isIntersecting){e.target.classList.add('visible');observer.unobserve(e.target);}});},{threshold:0.05,rootMargin:'0px 0px 80px 0px'});
function observeCards(){document.querySelectorAll('.card:not(.visible)').forEach(function(c){observer.observe(c);});}
var scrollT;
window.addEventListener('scroll',function(){if(scrollT)return;scrollT=setTimeout(function(){scrollT=null;if((window.innerHeight+window.scrollY)>=document.body.offsetHeight-600)loadMore();},100);},{passive:true});

// ====== INIT: Fetch all data from Wikipedia, then render ======
document.addEventListener('DOMContentLoaded', async function(){
  buildFilters();
  // Collect slugs
  var allSlugs = ITEMS.map(function(i){return i.slug;});
  var quoteSlugsToFetch = ITEMS.filter(function(i){return i.type==='q'&&!i.exactText;}).map(function(i){return i.slug;});
  var articleSlugs = ITEMS.filter(function(i){return i.type==='a';}).map(function(i){return i.slug;});
  var allFetchSlugs = quoteSlugsToFetch.concat(articleSlugs);

  console.log('Fetching extracts for', allFetchSlugs.length, 'items...');
  var extracts = await fetchExtracts(allFetchSlugs);
  var fetchedCount = Object.keys(extracts).length;
  console.log('Fetched', fetchedCount, 'of', allFetchSlugs.length, 'extracts');

  // Apply fetched text
  ITEMS.forEach(function(item){
    if(item.type==='q' && !item.exactText && extracts[item.slug]){
      item.fetchedText = extracts[item.slug];
    }
    if(item.type==='a' && extracts[item.slug]){
      item.fetchedText = extracts[item.slug];
    }
  });

  // Log any missing quotes
  var missingQuotes = ITEMS.filter(function(i){return i.type==='q'&&!i.exactText&&!i.fetchedText;});
  if(missingQuotes.length) {
    console.warn('Missing quotes for:', missingQuotes.map(function(i){return i.slug;}));
  }

  // Fetch all images
  console.log('Fetching images for', allSlugs.length, 'items...');
  var images = await fetchImages(allSlugs);
  imgCache = images;
  console.log('Fetched', Object.keys(images).length, 'images');

  // Hide loading banner
  document.getElementById('loadBanner').style.display='none';
  // Build the feed
  currentList = getFiltered();
  updateCount();
  loadMore();
});
</script>
